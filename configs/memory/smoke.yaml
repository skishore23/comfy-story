format: duet-x-ltx-decision1-v1
experiment:
  history_items: 8
  protected_exceptions: 2
  mandatory_guides: 1
  methods: [full_history_teacher, topk_only, recent_anchor_topk, mean_core_topk, gated_core_topk, centralized_resampler_topk, duet_core_topk]
  selectors: [random, recent, uniform, engineered, learned, oracle]
model:
  operator_size: 16
  salience_scale: 1000000
  teacher_timesteps: 3
training:
  optimizer_steps: 2
  seeds: [101, 202, 303]
  synthetic_smoke: true
primary_score:
  teacher_similarity: 0.35
  identity: 0.20
  rare_detail: 0.30
  continuity: 0.15
  bootstrap_samples: 10000
stop_gates:
  require_structural_gates: true
  require_positive_paired_ci: true
  require_exact_exceptions: true
  require_fixed_guide_count: true
  require_systems_advantage: true
  stop_on_gated_loss: true
  stop_on_resampler_loss: true
  stop_on_oracle_barely_improves: true
runtime:
  batch_size: 1
  latent_channels: 128
  require_equal_latent_shapes: true
  accumulation_dtype: float32
  model_dtype: bfloat16
  freeze_ltx: true
