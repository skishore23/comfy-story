name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        # Custody fixtures need private ancestry outside the source checkout.
        env:
          TMPDIR: ${{ runner.temp }}
        run: uv run python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Story frontend contracts
        run: node --test tests/js/*.mjs
